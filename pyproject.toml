[project]
name = "mesurado-pipeline"
version = "0.1.0"
description = "Content pipeline and pack validator for Mesurado"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "mcp>=1.2,<2",
    "numpy>=2.5.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: loads the real embedding model (downloads it on first use)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
