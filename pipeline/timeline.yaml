# Timeline source (spec: map-and-timeline R3; content-pipeline R10.3).
# Every event is tied to a passage in the pack. `quote` is a verbatim fragment of that passage; the build copies the
# whole sentence containing it as the event summary (summaryType "copied"), so no summary is ever written by us.
# Years are integers, negative for BCE. `end` is for ranges, `approx: true` for "about" dates.
# `reviewed` stays false until the subject expert has checked the event; the validator warns about unreviewed events.
eras:
  - {id: early-states, name: "Early states and trade", until: 1443}
  - {id: atlantic, name: "Atlantic trade and kingdoms", until: 1815}
  - {id: settlement, name: "Settlement and colonization", until: 1846}
  - {id: republic, name: "Independence and the republic", until: 1979}
  - {id: conflict, name: "Coup and civil wars", until: 2003}
  - {id: recovery, name: "Peace and recovery", until: 9999}

